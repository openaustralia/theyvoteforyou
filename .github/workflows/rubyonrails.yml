# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Ruby on Rails CI"
on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab. On main it runs the tests and then deploys main to staging.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Matches production, which is RDS MySQL 8.4 (see infrastructure repo's terraform/database.tf)
      mysql:
        image: mysql:8.4
        ports:
          - "3306:3306"
        env:
          MYSQL_DATABASE: rails_test
          MYSQL_USER: rails
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: rootpassword
        # Set health checks to wait until mysql has started
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    env:
      RAILS_ENV: test
      DATABASE_URL: "mysql2://rails:password@127.0.0.1:3306/rails_test"
    steps:
      - name: Install tidy
        run: sudo apt install -y tidy
      - name: Checkout code
        uses: actions/checkout@v7
      # Add or replace dependency steps here
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
      # Add or replace database setup steps here
      - name: Set up database schema
        run: bin/rails db:schema:load
      # Add or replace test runners here
      - name: Run tests
        run: bin/rake

  # TODO: Add codeclimate here. We used to run it on travis ci
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
      # TODO: Reinstate brakeman as soon as we have upgraded rails
      # - name: Security audit application code
      #   run: bin/brakeman -q -w2
      - name: Lint Ruby files
        run: bin/rubocop --parallel

  # Asks the staging server to deploy main. The job sends the server a token that GitHub signs for this run. The
  # deploy hook on the server (oaf-deploy-bottle, in its own repository on GitLab) checks the token, and then the
  # server starts the deploy itself. So this job holds no secret and has no access to the server.
  #
  # It runs for a push to main only when the repository variable AUTO_DEPLOY_STAGING is "true", so merging this
  # workflow does nothing until the server side is ready. Someone running the workflow by hand on main always
  # deploys. The tests and lint must pass first, either way.
  deploy-staging:
    name: Ask staging to deploy
    needs: [test, lint]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.AUTO_DEPLOY_STAGING == 'true'))
    runs-on: ubuntu-latest
    # The hook only accepts tokens from a job in this environment, so the environment must exist
    environment: staging
    permissions:
      id-token: write
    # One deploy request at a time. A request that arrives while another waits replaces the waiting one, which
    # is fine, because every deploy is of whatever main is by then.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      # The audience of the token is the hook's own URL. It must equal "audience" in the hook's config on the server.
      DEPLOY_HOOK_URL: https://test.theyvoteforyou.org.au/deploy-hook
    steps:
      - name: Get a token from GitHub and send it to the deploy hook
        run: |
          set -euo pipefail
          audience=$(jq -rn --arg url "$DEPLOY_HOOK_URL" '$url | @uri')
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "GitHub did not return a token. Does the job have id-token: write?" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          curl -sS --fail-with-body --retry 3 --retry-delay 5 -X POST \
            -H "Authorization: Bearer $token" "$DEPLOY_HOOK_URL"
