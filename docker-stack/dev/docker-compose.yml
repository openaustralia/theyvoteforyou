---
services:
  mysql:
    # Matches production, which is RDS MySQL 8.4 (see infrastructure repo's terraform/database.tf)
    image: "mysql:8.4"
    ports:
      - 3306:3306
    restart: "always"
    # volumes:
    #   - "/opt/data/mysql:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: "tvfy-development"
      MYSQL_USER: "theyvoteforyou"
      MYSQL_PASSWORD: "theyvoteforyou"

  # adminer:
  #   image: "adminer:latest"
  #   ports:
  #     - "8888:8080"
  #   restart: "always"
  #   environment:
  #     ADMINER_DEFAULT_SERVER: "mysql"
  #   depends_on:
  #     - mysql

  elasticsearch:
    # Matches production's Elasticsearch 7.17.7. Pulled from docker.elastic.co, which
    # publishes arm64 builds for Apple Silicon.
    image: "docker.elastic.co/elasticsearch/elasticsearch:7.17.7"
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: "always"
    environment:
      "discovery.type": "single-node"
      "http.port": "9200"
      "http.cors.enabled": "true"
      "http.cors.allow-origin": "http://localhost:1358,http://127.0.0.1:1358"
      "http.cors.allow-headers": "X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization"
      "http.cors.allow-credentials": "true"
      "ES_JAVA_OPTS": "-Xms512m -Xmx512m"

  dejavu:
    image: "appbaseio/dejavu:3.10.0"
    ports:
      - "1358:1358"
    restart: "always"
    depends_on:
      - elasticsearch

  mailpit:
    image: "axllent/mailpit:v1.31.3"
    ports:
      - "1025:1025" # SMTP
      - "1088:8025" # web UI
    restart: "always"

  # Runs the app itself in Docker, as an alternative to `bundle exec rails s` on
  # the host. Not used for production - see docs/adr/0003-rbenv-replaces-rvm.md.
  app:
    build:
      context: ../..
      args:
        RUBY_VERSION: ${RUBY_VERSION:-3.4.10}
    command: bash -c "bundle check || bundle install && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ../..:/app
      - bundle_cache:/usr/local/bundle
    environment:
      DB_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      MAILPIT_HOST: mailpit
      RAILS_ENV: development
    depends_on:
      - mysql
      - elasticsearch
      - mailpit

volumes:
  bundle_cache:
